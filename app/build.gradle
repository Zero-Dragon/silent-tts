plugins { id 'com.android.application' }

android {
    namespace 'local.silent.tts'
    compileSdk 36

    defaultConfig {
        applicationId 'local.silent.tts'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Local builds use the standard Android debug key. Release signing is private.
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
